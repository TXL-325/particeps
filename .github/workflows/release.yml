name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer tests
        run: python3 tests/installer/test_install.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build linux amd64 agent
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/particeps-agent-linux-amd64 ./cmd/particeps-agent
          cp deploy/install.sh dist/install.sh
          cd dist
          sha256sum particeps-agent-linux-amd64 install.sh > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/particeps-agent-linux-amd64 \
            dist/install.sh \
            dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
