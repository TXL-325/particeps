acceptance:
  - id: A1
    source: brief.md
    text: A13：在 Debian 13 amd64 上，通过 GitHub Release 的安装脚本完成首次安装、仅升级
      Agent、查看状态、从最近一次升级备份回滚，以及卸载。打版本 tag 后 GitHub Actions 构建 linux amd64，并上传
      Agent 二进制、install.sh 和 SHA256。脚本只从 Release 下载；SHA256 或 ELF64
      校验失败时不替换现有程序，不改配置与后端资源。首次安装使用 particeps 项目、particepsbr0（10.80.0.0/24 IPv4
      NAT）和 LVM thin 的 particeps-pool。新池按根分区可用整 GiB 的 30% 向下取整建议大小，下限 1 GiB、上限
      25 GiB且不超过可用空间；可用不足 1 GiB 时拒绝。交互允许输入 1 至可用 GiB 的整数并确认，非交互使用建议值；已有 lvm
      池保留，其他驱动拒绝。检测母机非回环、非容器/虚拟网桥接口上的 scope global IPv6（含 ULA）；有地址时新桥使用
      ipv6.address=auto、ipv6.nat=true，无地址时新桥禁用 IPv6。既有桥的 IPv4 地址与 NAT
      必须匹配；只有检测到上述 IPv6 且原 ipv6.address 为空/none 时补配 IPv6，其余配置保持。已有项目保留，已有
      `/etc/particeps/config.yaml` 不覆盖。新配置监听 0.0.0.0:8792，HTTP 会话 Cookie 默认非
      Secure，HTTPS 部署显式启用 Secure。安装显示在用非虚拟网卡的 IPv4 面板地址；无管理员时生成 20 位密码，经
      bootstrap-only 写入哈希，仅在安装终端展示，不写
      admin-bootstrap.txt；已有管理员不重置或重复交付。升级前备份程序、systemd 单元、配置和管理库（SQLite 在线备份含
      WAL；存在的 metrics.db 也备份；目录权限 0700），不含小鸡磁盘；升级不改实例、网桥、池和配置，原已停止的 Agent
      保持停止，服务重启失败不得报告成功且给出备份路径。`--status` 显示 Agent/Incus
      服务、监听地址和最近备份；`--rollback` 恢复程序、单元、配置和管理库。无参数终端提供安装/升级、状态、回滚、全部卸载、只卸 Agent
      五项操作。全卸先要求 PURGE，再删除 particeps 项目内全部实例、专用桥/池/项目及 Agent、配置和数据；此步骤保留其他项目和
      Incus。完成后列出其他项目实例并单独询问是否卸载 Incus：默认否，非交互保留，仅明确回答 y/Y 才 apt purge
      Incus/lxcfs 并清除 Incus 数据目录，此选择会清除其他项目实例，必须先说明影响。`--keep-instances`
      只停止并移除程序与服务，保留实例、网络、池、配置和数据，不进入 Incus 清除流程。并发安装/升级被锁拒绝。测试须分别核对新旧资源、IPv6
      有/无、管理员有/无、服务启停、保留/全卸及失败保护，mock 通过不代替实机结果。
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: A1：Linux amd64 Agent 在已准备的 Debian 13 实验母机启动，以同一二进制提供嵌入式 Web 和 /api/v1；管理
      ID、Incus 实例与查询对象对应。创建、查询、启停和删除仅操作本项目受管资源，其他工具的实例与参考仓库保持原样。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: A2：对本次创建、查询、端口修改、启停和删除接口，未认证请求被拒绝；只读 Token 只能查询，管理 Token
      可按权限执行，撤销后立即失效。会话写入执行来源校验，不能绕过管理权限。
    result: pending
