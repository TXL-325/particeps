    text: A7：已有实例可自动追加或指定可用号码，也可按协议编辑目标端口；实际转发、重新查询和界面展示一致。号码归属不变，修改一台不改变另一台规则或中断其已建立的连接。
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: A8：对单台实例停止和启动时保留已分配号码、单端口和自定义目标；停止后暂停其 DNAT，另一台保持可达。启动后按观察到的内部 IPv4
      重绑；地址丢失或操作结果未确认时显示等待/待核对且不复用旧归属，恢复后原 UDP 客户端可继续通信。
    result: pending
    reason: null
  - id: A10
    source: brief.md
    text: A9：删除时先摘除本实例映射并精确清理相关连接，确认实例删除后才回收号码。清理失败、写入中断或结果不明时保留占用和可查询原因，阻止危险重试/重分配；成功删除一台不影响另一台规则和连接，回收号码不得把旧入口连接导向新实例。
    result: pending
    reason: null
  - id: A11
    source: brief.md
    text: A10：本次创建、端口查询/追加/编辑、启停和删除均可通过 Web 与 API
      完成，遵循一致的校验、权限和结果语义，并有对应接口说明。失败或待核对状态清楚；修改后未取得新查询时不沿用旧的已应用或 SSH
      标记，切换实例后的迟到结果不能覆盖当前对象。
    result: pending
    reason: null
