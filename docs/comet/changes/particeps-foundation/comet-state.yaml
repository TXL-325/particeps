  - id: A4
    source: brief.md
    text: A3：管理员密码、API Token
      和小鸡初始密码不进入普通查询或日志。自动生成的初始凭据加密暂存，只能由管理权限领取一次；领取后清除，过期后不可领取并清理暂存内容；错误、重试和迟到响应不重新暴露凭据。
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: A4：默认系统为 Alpine，Web/API 同时提供 Alpine 和 Debian 13。一次正常请求可创建至少两台分别识别的 Incus
      系统容器，逐台结果可查询且与实际状态一致；另核对两种系统的实际运行系统、镜像来源和管理身份，不能用任务受理或 running 单独代替创建结果。
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: A5：默认端口池为 20000–59999，每台初始分配 20 个连续号码，池与数量可配置；同一号码的 TCP/UDP 归同一实例。号段首个 TCP
      转到该实例 22，其余 TCP 和全部 UDP 默认同号，实际目标可核对且不额外占用 SSH 号码。
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: A6：至少两台实例共享一个已核对属于母机的 IPv4 入口，外部客户端 TCP/UDP
      到达各自正确目标。自动分配跳过已占用号码，手工指定冲突被拒绝；并发请求不得重叠分配，宿主服务和非本系统 forward 对象不被接管、覆盖或清理。
    result: pending
    reason: null
  - id: A8
