        - "read"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Processes"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "502":
          "$ref": "#/components/responses/Error502"
  "/instances/{id}/metrics":
    parameters:
      -
        name: "id"
