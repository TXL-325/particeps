          name: "to"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
          description: "Unix 秒；省略则不限制该侧时间边界。"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Series"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
  "/tasks/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "对应对象 ID。"
    get:
      operationId: "getTask"
      summary: "查询逐实例任务进度"
      tags:
        - "管理"
      description: "普通查询不返回密码或密文。credentialAvailable 仅表示未领取且未过期；查询时清除该任务的过期暂存凭据。"
      x-permissions:
        - "admin"
        - "read"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Task"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
  "/tasks/{id}/credentials":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "对应对象 ID。"
    post:
      operationId: "claimCredentials"
      summary: "领取一次性初始凭据"
      tags:
        - "管理"
      description: "凭据加密暂存 15 分钟；成功领取清除，重复领取或过期返回空数组。启动、后台维护和相关查询均清理过期暂存。普通任务读取不能解密。响应丢失时可通过密码重置恢复。"
      x-permissions:
        - "admin"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Credentials"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "409":
          "$ref": "#/components/responses/Error409"
  "/images":
    get:
      operationId: "listImages"
      summary: "列出登记的镜像"
      tags:
        - "管理"
      description: "当前列表是本地登记信息，不代表已验证实际镜像或创建来源。"
      x-permissions:
        - "admin"
        - "read"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Images"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
    post:
      operationId: "registerImage"
      summary: "登记镜像别名"
      tags:
        - "管理"
      description: "当前仅登记本地别名；尚未核对实际镜像存在性。"
      x-permissions:
        - "admin"
        - "manage"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ImageRequest"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OK"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
  "/tokens":
    get:
      operationId: "listTokens"
      summary: "列出 API Token"
      tags:
        - "认证"
      description: "只返回元数据；空列表为 []。读取失败返回 500，不用空列表隐藏存储错误。"
      x-permissions:
        - "admin"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenList"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "500":
          "$ref": "#/components/responses/Error500"
    post:
      operationId: "createToken"
      summary: "签发 API Token"
      tags:
        - "认证"
      x-permissions:
        - "admin"
        - "manage"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TokenCreate"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenIssued"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "500":
          "$ref": "#/components/responses/Error500"
  "/tokens/{id}/revoke":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
        description: "对应对象 ID。"
    post:
      operationId: "revokeToken"
      summary: "撤销 API Token"
      tags:
        - "认证"
      description: "撤销后立即失效；重复撤销已有 Token 成功。管理 Token 可撤销自己或其他 Token。"
      x-permissions:
        - "admin"
        - "manage"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OK"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "500":
          "$ref": "#/components/responses/Error500"
  "/metrics/host":
    get:
      operationId: "getHostMetrics"
      summary: "查询母机资源历史"
      tags:
        - "管理"
      x-permissions:
        - "admin"
        - "read"
        - "manage"
      parameters:
        -
          name: "from"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
          description: "Unix 秒；省略则不限制该侧时间边界。"
        -
          name: "to"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
          description: "Unix 秒；省略则不限制该侧时间边界。"
      responses:
        "200":
          description: "成功。"
          headers:
            Cache-Control:
              schema:
                type: "string"
                enum:
                  - "no-store"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Series"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "500":
          "$ref": "#/components/responses/Error500"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "particeps_session"
    bearerToken:
      type: "http"
      scheme: "bearer"
      description: "独立只读或管理 Token；角色由 Agent 数据库校验。"
  schemas:
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
    OK:
      type: "object"
      required:
        - "ok"
      properties:
        ok:
          type: "string"
          enum:
            - "1"
    Meta:
      type: "object"
      required:
        - "product"
        - "api"
      properties:
        product:
          type: "string"
          enum:
            - "particeps"
        api:
          type: "string"
          enum:
            - "v1"
    LoginRequest:
      type: "object"
      required:
        - "password"
      properties:
        password:
          type: "string"
          format: "password"
      additionalProperties: false
    TokenCreate:
      type: "object"
      required:
        - "name"
        - "role"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        role:
          type: "string"
          enum:
            - "read"
            - "manage"
      additionalProperties: false
    Token:
      type: "object"
      required:
        - "id"
        - "name"
        - "role"
        - "createdAt"
        - "revoked"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        role:
          type: "string"
          enum:
            - "read"
            - "manage"
        createdAt:
          type: "integer"
          format: "int64"
        revoked:
          type: "boolean"
    TokenIssued:
      type: "object"
      required:
        - "id"
        - "token"
        - "role"
      properties:
        id:
          type: "string"
        token:
          type: "string"
          description: "仅本次响应返回明文；请妥善保存。"
        role:
          type: "string"
          enum:
            - "read"
            - "manage"
    TokenList:
      type: "object"
      required:
        - "tokens"
      properties:
        tokens:
          type: "array"
          items:
            "$ref": "#/components/schemas/Token"
    Pool:
      type: "object"
      properties:
        ipv4:
          type: "array"
          items:
            type: "string"
        ipv6:
          type: "array"
          items:
            type: "string"
        prefixes:
          type: "array"
          items:
            type: "string"
        natIPv4:
          type: "string"
        nat66:
          type: "string"
        dedicatedV4:
          type: "array"
          items:
            type: "string"
      additionalProperties: false
    Address:
      type: "object"
      properties:
        ip:
          type: "string"
        family:
          type: "string"
        prefix:
          type: "integer"
        interface:
          type: "string"
        kind:
          type: "string"
        global:
          type: "boolean"
    Network:
      type: "object"
      required:
        - "addresses"
      properties:
        addresses:
          type: "array"
          items:
            "$ref": "#/components/schemas/Address"
    Host:
      type: "object"
      properties:
        host:
          type: "object"
          additionalProperties: true
        cpuCapCores:
          type: "number"
        configuredCores:
          type: "number"
        overcommit:
          type: "number"
        guestCap:
          type: "object"
          additionalProperties: true
        incus:
          type: "object"
          required:
            - "ok"
          properties:
            ok:
              type: "boolean"
            error:
              type: "string"
    CapRequest:
      type: "object"
      required:
        - "cores"
      properties:
        cores:
          type: "number"
          minimum: 0.25
      additionalProperties: false
    CapResult:
      type: "object"
      required:
        - "cores"
        - "cap"
      properties:
        cores:
          type: "number"
        cap:
          type: "object"
          additionalProperties: true
    CreateRequest:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          minLength: 1
        image:
          type: "string"
          default: "alpine/3.21/cloud"
        cpuCores:
          type: "number"
          minimum: 0
          default: 0.5
        cpuPin:
          type: "string"
        memoryMib:
          type: "integer"
          minimum: 0
        diskGib:
          type: "integer"
          minimum: 0
        bandwidthMbps:
          type: "integer"
          minimum: 0
          default: 0
        stackMode:
          type: "string"
          enum:
            - "v4"
            - "v6"
            - "dual"
        sshPubKey:
          type: "string"
        password:
          type: "string"
          format: "password"
        passwordLogin:
          type: "boolean"
          default: true
        count:
          type: "integer"
          minimum: 0
          maximum: 256
          default: 1
      additionalProperties: false
      description: "零值资源采用模板默认值。CPU 以 0.01 核为步长，并受有效总帽及 CPU 集合约束；网络模式还须通过地址池检查。字段存在不代表尚未完成的 IPv6 或 SSH 能力已验收。"
    ResourceRequest:
      type: "object"
      properties:
        cpuCores:
          type: "number"
          minimum: 0.01
        cpuPin:
          type: "string"
        memoryMib:
          type: "integer"
          minimum: 1
        diskGib:
          type: "integer"
          minimum: 1
        bandwidthMbps:
          type: "integer"
          minimum: 0
      additionalProperties: false
    PasswordRequest:
      type: "object"
      properties:
        password:
          type: "string"
          format: "password"
          description: "为空或省略时自动生成。必须为不含换行或 NUL 的单行。"
      additionalProperties: false
    PasswordResult:
      type: "object"
      required:
        - "password"
      properties:
        password:
          type: "string"
          format: "password"
    RebuildRequest:
      type: "object"
      properties:
        image:
          type: "string"
      additionalProperties: false
    PortAdd:
      type: "object"
      properties:
        number:
          type: "integer"
          minimum: 0
          maximum: 65535
          default: 0
      additionalProperties: false
    PortEdit:
      type: "object"
      required:
        - "target"
      properties:
        target:
          type: "integer"
          minimum: 1
          maximum: 65535
      additionalProperties: false
    Port:
      type: "object"
      required:
        - "number"
        - "proto"
        - "listenIp"
        - "target"
      properties:
        number:
          type: "integer"
        proto:
          type: "string"
          enum:
            - "tcp"
            - "udp"
        listenIp:
          type: "string"
        target:
          type: "integer"
    Instance:
      type: "object"
      required:
        - "id"
        - "name"
        - "status"
        - "networkStatus"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        incusName:
          type: "string"
        image:
          type: "string"
        cpuCores:
          type: "number"
        cpuPin:
          type: "string"
        memoryMib:
          type: "integer"
        diskGib:
          type: "integer"
        bandwidthMbps:
          type: "integer"
        stackMode:
          type: "string"
        desiredPower:
          type: "string"
        natIpv4:
          type: "string"
        dedicatedIpv4:
          type: "string"
        ipv6:
          type: "string"
        ipv6Mode:
          type: "string"
        status:
          type: "string"
        resourceStatus:
          type: "string"
        networkStatus:
          type: "string"
          enum:
            - "unconfigured"
            - "pending"
            - "ready"
            - "inactive"
            - "waiting-address"
            - "cleanup-pending"
            - "needs-reconciliation"
          description: "ready 表示规则已回读且旧 NAT 连接已处理，不证明外部服务可达。其他状态可能仍保留分配，不得把失败当作回滚。"
        networkError:
          type: "string"
        cpuUsed:
          type: "number"
        memUsed:
          type: "integer"
          format: "int64"
        rxBps:
          type: "number"
          nullable: true
        txBps:
          type: "number"
          nullable: true
        cpuQuality:
          type: "string"
        networkQuality:
          type: "string"
        ports:
          type: "array"
          items:
            "$ref": "#/components/schemas/Port"
    Instances:
      type: "object"
      required:
        - "instances"
      properties:
        instances:
          type: "array"
          items:
            "$ref": "#/components/schemas/Instance"
    TaskItem:
      type: "object"
      required:
        - "name"
        - "status"
        - "step"
      properties:
        name:
          type: "string"
        instanceId:
          type: "string"
        status:
          type: "string"
        step:
          type: "string"
        error:
          type: "string"
        credentialAvailable:
          type: "boolean"
    Task:
      type: "object"
      required:
        - "id"
        - "kind"
        - "status"
        - "items"
      properties:
        id:
          type: "string"
        kind:
          type: "string"
        status:
          type: "string"
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/TaskItem"
    Credential:
      type: "object"
      required:
        - "name"
        - "instanceId"
        - "password"
      properties:
        name:
          type: "string"
        instanceId:
          type: "string"
        password:
          type: "string"
          format: "password"
    Credentials:
      type: "object"
      required:
        - "credentials"
      properties:
        credentials:
          type: "array"
          items:
            "$ref": "#/components/schemas/Credential"
    Image:
      type: "object"
      properties:
        alias:
          type: "string"
        source:
          type: "string"
        fingerprint:
          type: "string"
    Images:
      type: "object"
      required:
        - "images"
      properties:
        images:
          type: "array"
          items:
            "$ref": "#/components/schemas/Image"
          nullable: true
    ImageRequest:
      type: "object"
      required:
        - "alias"
      properties:
        alias:
          type: "string"
      additionalProperties: false
    Process:
      type: "object"
      properties:
        pid:
          type: "integer"
        name:
          type: "string"
        user:
          type: "string"
        state:
          type: "string"
        start:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "内核进程启动计数，用于区分 PID 复用。"
        cpu:
          type: "number"
          description: "当前为累计 CPU 秒，非瞬时百分比。"
        rss:
          type: "integer"
          format: "int64"
    Processes:
      type: "object"
      required:
        - "instanceId"
        - "processes"
      properties:
        instanceId:
          type: "string"
        processes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Process"
    Metric:
      type: "object"
      properties:
        ts:
          type: "integer"
          format: "int64"
        cpuCores:
          type: "number"
        rxBps:
          type: "number"
          nullable: true
        txBps:
          type: "number"
          nullable: true
        quality:
          type: "string"
        networkQuality:
          type: "string"
        quota:
          type: "number"
        quotaPercent:
          type: "number"
    Series:
      type: "object"
      required:
        - "series"
      properties:
        series:
          type: "array"
          items:
            "$ref": "#/components/schemas/Metric"
  responses:
    Error400:
      description: "请求字段、参数或当前状态不允许此操作。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Error401:
      description: "未认证或凭据无效。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Error403:
      description: "权限不足或会话来源校验失败。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Error404:
      description: "资源不存在。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Error409:
      description: "操作冲突或结果需要核对；可能已经保存变更，应重新查询状态。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Error429:
      description: "登录尝试达到限制，请在 Retry-After 指定的秒数后重试。"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
      headers:
        Retry-After:
